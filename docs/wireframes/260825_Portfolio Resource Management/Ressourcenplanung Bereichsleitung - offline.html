  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

<\u002Fdiv>\n                      <button type=\"button\" sc-camel-on-click=\"{{ pop.inc }}\" aria-label=\"Pensum erhöhen\" style=\"width:36px; height:36px; border:1px solid #D1D5DB; border-radius:6px; background:#fff; color:#111827; font-size:18px; cursor:pointer; font-family:inherit\">＋<\u002Fbutton>\n                    <\u002Fdiv>\n                    <div style=\"margin-top:10px; padding:9px 10px; border-radius:6px; background:{{ pop.warnBg }}; border:1px solid {{ pop.warnBorder }}; color:{{ pop.warnFg }}; font-size:12px; line-height:1.45; font-weight:600\">{{ pop.warn }}<\u002Fdiv>\n                    <div style=\"margin-top:10px; font-size:12px; color:#4B5563; font-weight:600\">Begründung <span style=\"font-weight:400; color:#6B7280\">— Pflicht bei Überlast<\u002Fspan><\u002Fdiv>\n                    <div style=\"margin-top:4px; min-height:50px; border:1px solid #D1D5DB; border-radius:6px; background:#fff; padding:7px 9px; font-size:12px; line-height:1.4; color:#6B7280\">Bauleitung Etappe 2 vorgezogen, Freigabe Abteilungsleitung liegt vor.<\u002Fdiv>\n                    <div style=\"margin-top:10px\"><button type=\"button\" style=\"border:0; background:transparent; padding:0; color:#1D4ED8; font-size:12px; font-weight:600; text-decoration:underline; text-underline-offset:2px; cursor:pointer; font-family:inherit\">An andere Person umbuchen<\u002Fbutton><\u002Fdiv>\n                  <div style=\"display:flex; gap:8px; margin-top:12px\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ pop.apply }}\" style=\"flex:1; height:36px; border:1px solid #2563EB; border-radius:6px; background:#2563EB; color:#fff; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit\">Übernehmen<\u002Fbutton>\n                      <button type=\"button\" sc-camel-on-click=\"{{ pop.cancel }}\" style=\"height:36px; padding:0 14px; border:1px solid #D1D5DB; border-radius:6px; background:#fff; color:#374151; font-size:14px; font-weight:500; cursor:poi Musterlingen, Ahornweg 4+6, Instandsetzung<\u002Fdiv>\n              <div style=\"font-size:12px; color:#4B5563; margin-top:2px\">Sonja Beispiel · Projektleitung · Q4/2026<\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:8px; margin-top:14px\">\n                <button type=\"button\" aria-label=\"Pensum verringern\" style=\"width:38px; height:38px; border:1px solid #D1D5DB; border-radius:6px; background:#fff; color:#111827; font-size:18px; font-family:inherit; cursor:pointer\">−<\u002Fbutton>\n                <div style=\"flex:1; height:38px; border:2px solid #2563EB; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:600; color:#111827; font-variant-numeric:tabular-nums\">95 %<\u002Fdiv>\n                <button type=\"button\" aria-label=\"Pensum erhöhen\" style=\"width:38px; height:38px; border:1px solid #D1D5DB; border-radius:6px; background:#fff; color:#111827; font-size:18px; font-family:inherit; cursor:pointer\">＋<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"margin-top:12px; padding:10px 12px; border-radius:6px; background:#fff; border:1px solid #E5E7EB; border-left:3px solid #DC2626; color:#991B1B; font-size:12px; line-height:1.55; font-weight:600\">Sonja Beispiel wäre damit bei 118 % — 18 % über der Anstellung.<\u002Fdiv>\n              <div style=\"margin-top:12px; font-size:12px; color:#374151; font-weight:600\">Begründung <span style=\"font-weight:400; color:#6B7280\">— Pflicht bei Überlast<\u002Fspan><\u002Fdiv>\n              <div style=\"margin-top:5px; min-height:56px; border:1px solid #D1D5DB; border-radius:6px; background:#fff; padding:8px 10px; font-size:13px; line-height:1.5; color:#6B7280; font-style:italic\">Bauleitung Etappe 2 vorgezogen, Freigabe Abteilungsleitung liegt vor.<\u002Fdiv>\n              <div style=\"margin-top:12px\"><button type=\"button\" style=\"border:0; background:transparent; padding:0; color:#1D4ED8; font-size:12px; font-weight:600; text-decoration:underline; text-underline-offset:2px; cursor:pointer; font-family:inherit\">An andere Person umbuchen<\u002Fbutton><\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:8px; margin-top:14px\">\n                <button type=\"button\" style=\"flex:1; height:38px; border:1px solid #2563EB; border-radius:6px; background:#2563EB; color:#fff; font-size:14px; font-weight:600; font-family:inherit\">Übernehmen<\u002Fbutton>\n                <button type=\"button\" style=\"height:38px; padding:0 14px; border:1px solid #D1D5DB; border-radius:6px; background:#fff; color:#374151; font-size:14px; font-weight:500; font-family:inherit\">Abbrechen<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"margin-top:10px; font-size:11px; color:#6B7280; line-height:1.5\">Übernehmen schreibt den Eintrag in den Verlauf. Esc bricht ab.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"width:1440px; box-sizing:border-box; display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; background:#fff; border:1px solid #D0D5DD; border-radius:8px; padding:20px\">\n          <div><div style=\"font-size:12px; font-weight:600; color:#6B7280\">Ablauf<\u002Fdiv><p style=\"margin:6px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Bearbeiten einschalten → Zelle anklicken → Popup am Ort der Zelle. Minus und Plus in 5-%-Schritten oder Wert direkt eintippen. Die Folgezeile rechnet live: Person, neuer Stand, Abstand zur Anstellung.<\u002Fp><\u002Fdiv>\n          <div><div style=\"font-size:12px; font-weight:600; color:#6B7280\">Regeln<\u002Fdiv><p style=\"margin:6px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Begründung ist Pflicht, sobald der neue Stand über 100 % liegt — vorher bleibt Übernehmen inaktiv. Jede Übernahme erzeugt einen Verlaufseintrag mit altem und neuem Wert. Es gibt kein Speichern der Seite; jede Zelle ist eine eigene Transaktion. Vergangene und -size:14px; font-weight:500; cursor:pointer; font-family:inherit\">Abbrechen<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"margin-top:10px; font-size:11px; color:#6B7280; line-height:1.55\">Erzeugt einen Verlaufseintrag mit beiden Seiten.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:1440px; box-sizing:border-box; display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; background:#fff; border:1px solid #D0D5DD; border-radius:8px; padding:20px\">\n          <div><div style=\"font-size:12px; font-weight:600; color:#6B7280\">Ein Vorgang<\u002Fdiv><p style=\"margin:6px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Von, an, Betrag, Zeitraum, eine Begründung — ein Verlaufseintrag mit beiden Seiten statt zwei unabhängiger Transaktionen. Das ist der Flow, der im Alltag tatsächlich vorkommt.<\u002Fp><\u002Fdiv>\n          <div><div style=\"font-size:12px; font-weight:600; color:#6B7280\">Auswahl<\u002Fdiv><p style=\"margin:6px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Ein Suchfeld mit alphabetischer Trefferliste — ohne Auslastungsrechnung im Dialog. Ob das Ziel Kapazität hat, zeigt das Raster; der Dialog behauptet keine Berechnung, die weder definiert noch von Nutzenden verlangt ist.<\u002Fp><\u002Fdiv>\n          <div><div style=\"font-size:12px; font-weight:600; color:#6B7280\">Grenzen<\u002Fdiv><p style=\"margin:6px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Umbuchen ändert Pensen, nie die Rolle oder den Bedarf des Projekts. Beginn frühestens im nächsten Quartal; rückwirkende Korrekturen bleiben der Administration vorbehalten.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      \n\n      <div id=\"1a3b\" style=\"display:flex; flex-direction:column; gap:14px; width:1440px\">\n        <div style=\"display:flex; align-items:center; gap:12px; flex-wrap:wrap\">\n          <span style=\"display:inline-flex; align-items:center; justify-content:center; min-width:34px; ine-flex; align-items:center; height:38px; padding:0 14px; border:1px solid #D1D5DB; border-radius:6px; background:#fff; color:#374151; font-size:14px; font-weight:500\">v1<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:28px; display:flex; flex-direction:column; gap:24px\">\n            <div style=\"display:grid; grid-template-columns:1fr 420px; gap:20px; align-items:start\">\n              <div style=\"display:flex; flex-direction:column; gap:20px\">\n                <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; overflow:hidden\">\n                <div style=\"padding:14px 16px; background:#f5f7fb; border-bottom:1px solid #E5E7EB\">\n                  <div style=\"font-size:15px; font-weight:600; color:#111827\">Projekte<\u002Fdiv>\n                  <div style=\"font-size:12px; color:#6B7280; margin-top:3px\">Stammdaten gespiegelt aus SAP ePPM, lesend. Planungsdaten in verschachtelten JSONB-Feldern.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:78px 340px 1fr; align-items:center; gap:16px; padding:11px 16px; border-bottom:1px solid #F3F4F6; font-size:13px\">\n                  <span style=\"justify-self:start; padding:3px 8px; border-radius:6px; background:#DCFCE7; color:#166534; font-size:11px; font-weight:700; font-family:'SFMono-Regular', Consolas, monospace\">GET<\u002Fspan>\n                  <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; color:#111827\">/api/v1/projects<\u002Fspan>\n                  <span style=\"color:#4B5563; line-height:1.5\">Liste, gefiltert über phase, lead, location, quarter_from, quarter_to. Paginiert.<\u002Fspan>\n                <\u002Fdiv><div style=\"display:grid; grid-template-columns:78px 340px 1fr; align-items:center; gap:16px; padding:11px 16px; border-bottom:1px solid #F3F4F6; font-size:13px\">\n                  <span style=\"justify-self:start; padding:3px 8px; border-radius:6px; background:#DCFCE7; color:#166534; font-size:11px; font-weight:700; font-family:'SFMono-Regular', Consolas, monospace\">GET<\u002Fspan>\n                  <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; color:#111827\">/api/v1/projects/{id}<\u002Fspan>\n                  <span style=\"color:#4B5563; line-height:1.5\">Ein Projekt mit allocations, milestones und targets als verschachtelte Objekte.<\u002Fspan>\n                <\u002Fdiv><div style=\"display:grid; grid-template-columns:78px 340px 1fr; align-items:center; gap:16px; padding:11px 16px; border-bottom:1px solid #F3F4F6; font-size:13px\">\n                  <span style=\"justify-self:start; padding:3px 8px; border-radius:6px; background:#FEF3C7; color:#78350F; font-size:11px; font-weight:700; font-family:'SFMono-Regular', Consolas, monospace\">PATCH<\u002Fspan>\n                  <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; color:#111827\">/api/v1/projects/{id}/allocations<\u002Fspan>\n                  <span style=\"color:#4B5563; line-height:1.5\">Pensum je Person und Quartal setzen. Verlangt reason bei Überlast.<\u002Fspan>\n                <\u002Fdiv><div style=\"display:grid; grid-template-columns:78px 340px 1fr; align-items:center; gap:16px; padding:11px 16px; font-size:13px\">\n                  <span style=\"justify-self:start; padding:3px 8px; border-radius:6px; background:#DCFCE7; color:#166534; font-size:11px; font-weight:700; font-family:'SFMono-Regular', Consolas, monospace\">GET<\u002Fspan>\n                  <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; color:#111827\">/api/v1/projects/{id}/history<\u002Fspan>\n                  <span style=\"color:#4B5563; line-height:1.5\">Änderungsprotokoll dieses Projekts, unveränderlich.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n                <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; overflow:hidden\">\n                <div style=\"padding:14px 16px; background:#f5f7fb; border-bottom:1px solid #E5E7EB\">\n                  <div style=\"font-size:15px; font-weight:600; color:#111827\">Kapazität<\u002Fdiv>\n                  <div style=\"font-size:12px; color:#6B7280; margin-top:3px\">Personen, Anstellungsgrade und Abwesenheiten. App-eigen, sofern HR keine Schnittstelle liefert.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:78px 340px 1fr; align-items:center; gap:16px; padding:11px 16px; border-bottom:1px solid #F3F4F6; font-size:13px\">\n                  <span style=\"justify-self:start; padding:3px 8px; border-radius:6px; background:#DCFCE7; color:#166534; font-size:11px; font-weight:700; font-family:'SFMono-Regular', Consolas, monospace\">GET<\u002Fspan>\n                  <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; color:#111827\">/api/v1/capacity<\u002Fspan>\n                  <span style=\"color:#4B5563; line-height:1.5\">Netto-Kapazität je Quartal, aggregiert über die gefilterte Menge.<\u002Fspan>\n                <\u002Fdiv><div style=\"display:grid; grid-template-columns:78px 340px 1fr; align-items:center; gap:16px; padding:11px 16px; border-bottom:1px solid #F3F4F6; font-size:13px\">\n                  <span style=\"justify-self:start; padding:3px 8px; border-radius:6px; background:#DCFCE7; color:#166534; font-size:11px; font-weight:700; font-family:'SFMono-Regular', Consolas, monospace\">GET<\u002Fspan>\n                  <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; color:#111827\">/api/v1/capacity/people<\u002Fspan>\n                  <span style=\"color:#4B5563; line-height:1.5\">Auslastung je Person und Quartal, inklusive Anstellungsgrad.<\u002Fspan>\n                <\u002Fdiv><div style=\"display:grid; grid-template-columns:78px 340px 1fr; align-items:center; gap:16px; padding:11px 16px; font-size:13px\">\n                  <span style=\"justify-self:start; padding:3px 8px; border-radius:6px; background:#FEF3C7; color:#78350F; font-size:11px; font-weight:700; font-family:'SFMono-Regular', Consolas, monospace\">PATCH<\u002Fspan>\n                  <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; color:#111827\">/api/v1/capacity/absences/{person_id}<\u002Fspan>\n                  <span style=\"color:#4B5563; line-height:1.5\">Abwesenheiten je Quartal erfassen.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n                <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; overflow:hidden\">\n                <div style=\"padding:14px 16px; background:#f5f7fb; border-bottom:1px solid #E5E7EB\">\n                  <div style=\"font-size:15px; font-weight:600; color:#111827\">Meilensteine<\u002Fdiv>\n                  <div style=\"font-size:12px; color:#6B7280; margin-top:3px\">Termine gespiegelt aus ePPM. Verschiebungen laufen als Antrag, nicht als Schreibzugriff.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:78px 340px 1fr; align-items:center; gap:16px; padding:11px 16px; border-bottom:1px solid #F3F4F6; font-size:13px\">\n                  <span style=\"justify-self:start; padding:3px 8px; border-radius:6px; background:#DCFCE7; color:#166534; font-size:11px; font-weight:700; font-family:'SFMono-Regular', Consolas, monospace\">GET<\u002Fspan>\n                  <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; color:#111827\">/api/v1/milestones<\u002Fspan>\n                  <span style=\"color:#4B5563; line-height:1.5\">Gates mit plan_date, forecast_date und status. Filter wie bei Projekten.<\u002Fspan>\n                <\u002Fdiv><div style=\"display:grid; grid-template-columns:78px 340px 1fr; align-items:center; gap:16px; padding:11px 16px; font-size:13px\">\n                  <span style=\"justify-self:start; padding:3px 8px; border-radius:6px; background:#DBEAFE; color:#1E40AF; font-size:11px; font-weight:700; font-family:'SFMono-Regular', Consolas, monospace\">POST<\u002Fspan>\n                  <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; color:#111827\">/api/v1/milestones/{id}/reschedule-request<\u002Fspan>\n                  <span style=\"color:#4B5563; line-height:1.5\">Antrag auf Verschiebung mit Begründung. Antwort enthält request_id.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n                <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; overflow:hidden\">\n                <div style=\"padding:14px 16px; background:#f5f7fb; border-bottom:1px solid #E5E7EB\">\n                  <div style=\"font-size:15px; font-weight:600; color:#111827\">Verlauf und Export<\u002Fdiv>\n                  <div style=\"font-size:12px; color:#6B7280; margin-top:3px\">Protokoll und Ausgabeformate.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:78px 340px 1fr; align-items:center; gap:16px; padding:11px 16px; border-bottom:1px solid #F3F4F6; font-size:13px\">\n                  <span style=\"justify-self:start; padding:3px 8px; border-radius:6px; background:#DCFCE7; color:#166534; font-size:11px; font-weight:700; font-family:'SFMono-Regular', Consolas, monospace\">GET<\u002Fspan>\n                  <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; color:#111827\">/api/v1/history<\u002Fspan>\n                  <span style=\"color:#4B5563; line-height:1.5\">Alle Änderungen, paginiert, filterbar nach field, person, project, period.<\u002Fspan>\n                <\u002Fdiv><div style=\"display:grid; grid-template-columns:78px 340px 1fr; align-items:center; gap:16px; padding:11px 16px; font-size:13px\">\n                  <span style=\"justify-self:start; padding:3px 8px; border-radius:6px; background:#DCFCE7; color:#166534; font-size:11px; font-weight:700; font-family:'SFMono-Regular', Consolas, monospace\">GET<\u002Fspan>\n                  <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; color:#111827\">/api/v1/export<\u002Fspan>\n                  <span style=\"color:#4B5563; line-height:1.5\">CSV oder XLSX der aktuellen Auswahl. Parameter format, view, filter.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n                <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; overflow:hidden\">\n                <div style=\"padding:14px 16px; background:#f5f7fb; border-bottom:1px solid #E5E7EB\">\n                  <div style=\"font-size:15px; font-weight:600; color:#111827\">Benutzer<\u002Fdiv>\n                  <div style=\"font-size:12px; color:#6B7280; margin-top:3px\">Kein eigenes Benutzerverwaltungs-CRUD. Identität und Rollen kommen aus eIAM.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:78px 340px 1fr; align-items:center; gap:16px; padding:11px 16px; border-bottom:1px solid #F3F4F6; font-size:13px\">\n                  <span style=\"justify-self:start; padding:3px 8px; border-radius:6px; background:#DCFCE7; color:#166534; font-size:11px; font-weight:700; font-family:'SFMono-Regular', Consolas, monospace\">GET<\u002Fspan>\n                  <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; color:#111827\">/api/v1/me<\u002Fspan>\n                  <span style=\"color:#4B5563; line-height:1.5\">Angemeldete Person, Rollen und zugängliche Abteilungen. Ableitung aus dem eIAM-Token.<\u002Fspan>\n                <\u002Fdiv><div style=\"display:grid; grid-template-columns:78px 340px 1fr; align-items:center; gap:16px; padding:11px 16px; font-size:13px\">\n                  <span style=\"justify-self:start; padding:3px 8px; border-radius:6px; background:#DCFCE7; color:#166534; font-size:11px; font-weight:700; font-family:'SFMono-Regular', Consolas, monospace\">GET<\u002Fspan>\n                  <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; color:#111827\">/api/v1/people<\u002Fspan>\n                  <span style=\"color:#4B5563; line-height:1.5\">Personen der eigenen Abteilung für Filter und Zuweisung. Lesend.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex; flex-direction:column; gap:20px\">\n                <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:12px\">\n                  <div style=\"font-size:15px; font-weight:600; color:#111827\">Projekt · verschachteltes JSONB<\u002Fdiv>\n                  <pre style=\"margin:0; padding:16px; background:#0F172A; color:#DBE3F5; border-radius:8px; font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; line-height:1.65; overflow:auto\">{\n  \"id\": 8640100051,\n  \"title\": \"Musterlingen, Ahornweg 4+6\",\n  \"phase\": \"32\",\n  \"lead\": \"sonja.beispiel\",\n  \"location\": \"Musterlingen\",\n  \"budget_chf\": 3050000,\n  \"allocations\": [\n    { \"person\": \"sonja.beispiel\",\n      \"role\": \"projektleitung\",\n      \"quarter\": \"2026Q3\",\n      \"pensum_pct\": 50 }\n  ],\n  \"targets\": [\n    { \"quarter\": \"2026Q3\", \"pensum_pct\": 80 }\n  ],\n  \"milestones\": [\n    { \"code\": \"MS4\",\n      \"plan_date\": \"2027-06-30\",\n      \"forecast_date\": \"2027-06-30\",\n      \"status\": \"on_track\" }\n  ],\n  \"source\": \"eppm\",\n  \"synced_at\": \"2026-08-25T05:15:00Z\"\n}<\u002Fpre>\n                  <div style=\"font-size:12px; color:#4B5563; line-height:1.55\">allocations, targets und milestones sind JSONB — sie ändern sich mit der Planung und brauchen keine eigene Tabelle pro Quartal. Was aus ePPM kommt, trägt source und synced_at.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:10px\">\n                  <div style=\"font-size:15px; font-weight:600; color:#111827\">Authentisierung<\u002Fdiv>\n                  <div style=\"font-size:13px; color:#4B5563; line-height:1.55\">Bearer-Token aus eIAM, OIDC. Rollen als Claims: <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px\">read<\u002Fspan>, <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px\">plan<\u002Fspan>, <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px\">admin<\u002Fspan>. Die Abteilungszugehörigkeit kommt aus dem Token, nicht aus einem Parameter.<\u002Fdiv>\n                  <pre style=\"margin:0; padding:16px; background:#0F172A; color:#DBE3F5; border-radius:8px; font-family:'SFMono-Regular', Consolas, monospace; font-size:12px; line-height:1.65; overflow:auto\">Authorization: Bearer &lt;eIAM-Token&gt;\nAccept: application/json<\u002Fpre>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:14px 28px; background:#fff; border-top:1px solid #E5E7EB; font-size:12px; color:#6B7280\">\n            <span>Version 0.4 · Prototyp<\u002Fspan>\n            <span style=\"color:#4B5563\">Stand 25.08.2026, 07:15<\u002Fspan>\n            <span style=\"display:flex; align-items:center; gap:16px\">\n              <a href=\"#1a\" style=\"color:#4B5563\">Kontakt<\u002Fa>\n              <a href=\"#1a\" style=\"color:#4B5563\">Quellcode<\u002Fa>\n              <a href=\"#1a\" style=\"color:#4B5563\">API<\u002Fa>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"width:1440px; box-sizing:border-box; display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; background:#fff; border:1px solid #D0D5DD; border-radius:8px; padding:20px\">\n          <div><div style=\"font-size:12px; font-weight:600; color:#6B7280\">Umfang<\u002Fdiv><p style=\"margin:6px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Ein Ressourcentyp trägt fast alles: das Projekt mit allocations, targets und milestones als JSONB. Dazu Kapazität, Verlauf, Export und zwei lesende Benutzer-Endpunkte.<\u002Fp><\u002Fdiv>\n          <div><div style=\"font-size:12px; font-weight:600; color:#6B7280\">Schreibrichtung<\u002Fdiv><p style=\"margin:6px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Geschrieben wird nur, was die App besitzt: Pensen, Abwesenheiten, Begründungen. Termine aus ePPM werden nicht überschrieben — dafür gibt es reschedule-request.<\u002Fp><\u002Fdiv>\n          <div><div style=\"font-size:12px; font-weight:600; color:#6B7280\">Offen<\u002Fdiv><p style=\"margin:6px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Braucht es Webhooks für ePPM-Änderungen, oder genügt der nächtliche Abgleich? Und wird der Export serverseitig erzeugt oder aus der gefilterten Ansicht im Client?<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n\n    \n\n\n\n    \n\n    \n\n\n  \n\n  <div style=\"display:flex; flex-direction:column; gap:16px; max-width:1440px\">\n    <div style=\"display:flex; align-items:baseline; gap:10px; border-bottom:2px solid #12213E; padding-bottom:8px\">\n      <span style=\"font-size:20px; font-weight:700; color:#111827\">Nutzergruppen und Einsatzsituationen<\u002Fspan>\n      <span style=\"font-size:14px; color:#6B7280\">wer die App nutzt, wo sie eingesetzt wird, was noch fehlt<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:14px\">\n      <div style=\"background:#fff; border:1px solid #D0D5DD; border-radius:8px; padding:20px\"><div style=\"font-size:12px; font-weight:600; color:#6B7280\">Wöchentliche Teamsitzung<\u002Fdiv><p style=\"margin:6px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Übersicht mit Bearbeiten an: Pensen verteilen, Überlast sofort begründen, Umbuchen direkt aus der Zelle. Das Raster ist der Sitzungstisch.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #D0D5DD; border-radius:8px; padding:20px\"><div style=\"font-size:12px; font-weight:600; color:#6B7280\">Bereichsleitungs-Sitzung<\u002Fdiv><p style=\"margin:6px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Dashboard und Termine projiziert, read-only. Der zitierfähige Stand kommt aus dem PDF-Export mit Zeitstempel und Dokument-ID.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #D0D5DD; border-radius:8px; padding:20px\"><div style=\"font-size:12px; font-weight:600; color:#6B7280\">Quartalsplanung<\u002Fdiv><p style=\"margin:6px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Soll gegen Plan, Umbuchungen, danach ein referenzierbarer Stand. Der Planstand (freigegeben gegen Arbeitsversion) ist die offene Modellfrage dahinter.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:14px\">\n      <div style=\"background:#fff; border:1px solid #D0D5DD; border-radius:8px; padding:20px\">\n        <div style=\"display:flex; align-items:center; gap:8px\"><span style=\"font-size:15px; font-weight:600; color:#111827\">Leitung Bereich Bauten<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#166534; background:#DCFCE7; border-radius:9999px; padding:2px 8px\">Primär<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Setzt Prioritäten über die Abteilungen. Braucht Auslastung und Kredit in einem Bild und einen Stand, auf den sich die Geschäftsleitung beziehen kann.<\u002Fp>\n        <p style=\"margin:8px 0 0; font-size:12px; line-height:1.5; color:#8A4A0B\">Lücke: Planstand — freigegeben gegen Arbeitsversion — existiert noch nicht.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #D0D5DD; border-radius:8px; padding:20px\">\n        <div style=\"display:flex; align-items:center; gap:8px\"><span style=\"font-size:15px; font-weight:600; color:#111827\">Leitung Immobilienmanagement<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#166534; background:#DCFCE7; border-radius:9999px; padding:2px 8px\">Primär<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Plant die Bewirtschaftung 61–63 — Grundlast neben den Projekten, gleiche Personen, gleiche Quartale.<\u002Fp>\n        <p style=\"margin:8px 0 0; font-size:12px; line-height:1.5; color:#8A4A0B\">Lücke: Unterhalt ist Dauerlast ohne Enddatum; das Modell kennt nur Projekte.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #D0D5DD; border-radius:8px; padding:20px\">\n        <div style=\"display:flex; align-items:center; gap:8px\"><span style=\"font-size:15px; font-weight:600; color:#111827\">Leitung Projektentwicklung<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#166534; background:#DCFCE7; border-radius:9999px; padding:2px 8px\">Primär<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Sortiert Vorhaben vor MS1/MS2 nach Kapazitätsbedarf — was startet dieses Jahr nicht — und vergleicht Varianten desselben Vorhabens.<\u002Fp>\n        <p style=\"margin:8px 0 0; font-size:12px; line-height:1.5; color:#8A4A0B\">Lücke: Varianten sind unverbundene Einzelprojekte; eine Priorisierungsliste fehlt.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #D0D5DD; border-radius:8px; padding:20px\">\n        <div style=\"display:flex; align-items:center; gap:8px\"><span style=\"font-size:15px; font-weight:600; color:#111827\">Leitung Projektmanagement<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#4B5563; background:#F3F4F6; border-radius:9999px; padding:2px 8px\">Sekundär<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Nutzt die App am häufigsten, operativ innerhalb gesetzter Prioritäten: Pensen verteilen, Überlast begründen, umbuchen, Soll gegen Plan halten.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #D0D5DD; border-radius:8px; padding:20px\">\n        <div style=\"display:flex; align-items:center; gap:8px\"><span style=\"font-size:15px; font-weight:600; color:#111827\">Projektmanager und Projektentwickler<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#4B5563; background:#F3F4F6; border-radius:9999px; padding:2px 8px\">Sekundär<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Sehen «Meine Projekte» und die eigene Auslastung, melden Bedarf je Phase, lesen das Projekt-Detail statt des ganzen Portfolios.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #D0D5DD; border-radius:8px; padding:20px\">\n        <div style=\"display:flex; align-items:center; gap:8px\"><span style=\"font-size:15px; font-weight:600; color:#111827\">Portfoliomanagement PPM<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#8A4A0B; background:#FEF3C7; border-radius:9999px; padding:2px 8px\">Zu bestätigen<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0; font-size:13px; line-height:1.55; color:#4B5563\">Standards, Exporte, Administration und rückwirkende Korrekturen. Rolle überlappt mit der Leitung Bereich Bauten — Klärung offen.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; flex-direction:column; gap:16px; max-width:1440px\">\n    <div>\n      <div style=\"font-size:12px; color:#6B7280; font-weight:600\">Technische Notizen<\u002Fdiv>\n      <p style=\"margin:8px 0 0; max-width:900px; font-size:15px; line-height:1.55; color:#4B5563; text-wrap:pretty\">Annahme: SAP ePPM ist das Leitsystem und führt den Golden Record. Daraus folgt fast alles Übrige — insbesondere, was diese App <em>nicht<\u002Fem> tun muss.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; overflow:hidden\">\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; height:40px; align-items:center; background:#F3F4F6; font-size:12px; font-weight:600; color:#4B5563\">\n        <div style=\"padding:0 16px\">SAP ePPM führt<\u002Fdiv>\n        <div style=\"padding:0 16px; border-left:1px solid #E5E7EB\">Diese App führt<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; border-top:1px solid #E5E7EB; font-size:13px; line-height:1.6; color:#374151\">\n        <div style=\"padding:16px\">Bauprojekt-Stammdaten, ID und Bezeichnung · SIA-Phase und Teilphase · Projektverantwortliche · Kredite und Kostenstand · Meilensteintermine · Geschäftspartner und externe Büros · Organisationsstruktur<\u002Fdiv>\n        <div style=\"padding:16px; border-left:1px solid #E5E7EB\">Pensum-Zuteilung je Person, Projekt und Quartal · Rollen im Projekt · Soll-Werte und Planstände · Abwesenheiten und Anstellungsgrade, falls HR sie nicht liefert · Begründungen und Freigaben bei Überlast · Priorisierung und Varianten<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:14px 16px; border-top:1px solid #E5E7EB; background:#F9FAFB; font-size:12px; color:#4B5563; line-height:1.5\">Alles links ist lesend gespiegelt und in der App nicht editierbar. Alles rechts existiert in ePPM nicht und ist der eigentliche Grund für die App.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:20px\">\n      <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; align-items:baseline; gap:8px; flex-wrap:wrap\">\n          <h3 style=\"margin:0; font-size:16px; font-weight:600; color:#111827\">Kleine Bildschirme<\u002Fh3>\n          <span style=\"font-size:11px; font-weight:600; color:#374151; background:#F3F4F6; border-radius:9999px; padding:2px 8px\">ab 1280 px<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.55; color:#4B5563\">Entworfen ist auf 1440 px. Auf einem 13-Zoll-Laptop bleiben rund 1280 px, auf 1180 px im geteilten Fenster. Das Raster braucht 806 px für die Textspalten und 72 px je Quartal — bei 1280 px passen sechs Quartale statt acht.<\u002Fp>\n        <div style=\"font-size:13px; line-height:1.55; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Reihenfolge des Abbaus: zuerst weniger Quartale statt engere Spalten; dann Kredit und Ampel über das Attribute-Menü ausblenden; dann die Textspalten mit fixierter linker Hälfte horizontal scrollen. Nie die Schriftgrösse unter 13 px oder die Zeilenhöhe unter 38 px.<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.55; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Balkenplan und Kalender scrollen horizontal, mit fixierter Projektspalte und fixierter Kopfzeile. Die Toolbar bricht in zwei Zeilen, die Filter behalten ihre Reihenfolge. Die KPI-Leiste wird von fünf auf drei Karten reduziert; die übrigen zwei stehen auf der Landing Page.<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.55; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Unter 900 px ist keine Planung mehr sinnvoll — dort zeigt die App nur die Landing Page als Lesesicht mit gestapelten Karten und den Verlauf. Mobil bearbeitet niemand ein Pensum-Raster.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; align-items:baseline; gap:8px; flex-wrap:wrap\">\n          <h3 style=\"margin:0; font-size:16px; font-weight:600; color:#111827\">Datenmenge und Laden<\u002Fh3>\n          <span style=\"font-size:11px; font-weight:600; color:#374151; background:#F3F4F6; border-radius:9999px; padding:2px 8px\">512 Projekte<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.55; color:#4B5563\">Keine Seitenblätterung im Raster. Ein Kapazitätsraster wird gelesen und summiert — Seitengrenzen zerschneiden die Fusszeile, und eine Summe pro Seite ist wertlos. Der Filter ist die Mengenbegrenzung: eine Abteilungsleitung arbeitet mit 30 bis 60 Projekten, nie mit 512.<\u002Fp>\n        <div style=\"font-size:13px; line-height:1.55; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Technisch: erst die Aggregate und die ersten rund 50 Zeilen laden, den Rest beim Scrollen nachziehen und nur die sichtbaren Zeilen rendern. Kopf- und Fusszeile bleiben fixiert, die Summen kommen aus der Datenschicht über die gefilterte Menge — nicht aus den gerenderten Zeilen.<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.55; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Beim Öffnen ist ein Umfang gesetzt: eigene Abteilung, acht Quartale ab heute. Ohne gesetzten Umfang zeigt die Ansicht keine 512 Zeilen, sondern die Aufforderung, einen zu wählen.<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.55; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Gruppierung hilft zusätzlich: nach Projektleitung eingeklappt sind es zwölf Gruppenzeilen statt 512 Projektzeilen. In der Meilenstein-Liste, die man durchgeht statt sie zu summieren, wäre Blätterung vertretbar — Sortieren und Filtern ist dort aber immer noch schneller.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; align-items:baseline; gap:8px; flex-wrap:wrap\">\n          <h3 style=\"margin:0; font-size:16px; font-weight:600; color:#111827\">Filter und URL<\u002Fh3>\n          <span style=\"font-size:11px; font-weight:600; color:#374151; background:#F3F4F6; border-radius:9999px; padding:2px 8px\">Zustand<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.55; color:#4B5563\">Suche, Filter, Gruppierung, Zeitraum und Einheit stehen als URL-Parameter. Damit ist jede Ansicht adressierbar, teilbar und als Lesezeichen brauchbar — und der Rückweg über den Browser funktioniert wie erwartet.<\u002Fp>\n        <div style=\"font-size:13px; line-height:1.5; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Der Filter bleibt beim Tabwechsel aktiv: wer im Dashboard auf Rolle Bauleitung filtert und in die Übersicht wechselt, sieht dort dieselbe Auswahl. Nur der Tab-Parameter ändert sich.<\u002Fdiv>\n        <div style=\"font-size:12px; color:#6B7280; font-family:'SFMono-Regular', Consolas, monospace; background:#F9FAFB; border:1px solid #E5E7EB; border-radius:6px; padding:9px 11px; line-height:1.5\">?tab=dashboard&amp;rolle=bauleitung&amp;phase=3&amp;von=2026Q3&amp;bis=2028Q2&amp;einheit=pct<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.5; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Konsequenz für die Oberfläche: die Zeile «Aktive Filter» muss immer zeigen, was gesetzt ist, auch wenn es aus einer geteilten URL kommt — sonst erklärt sich eine gefilterte Ansicht nicht.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; align-items:baseline; gap:8px; flex-wrap:wrap\">\n          <h3 style=\"margin:0; font-size:16px; font-weight:600; color:#111827\">Benutzerverwaltung über eIAM<\u002Fh3>\n          <span style=\"font-size:11px; font-weight:600; color:#374151; background:#F3F4F6; border-radius:9999px; padding:2px 8px\">zentral<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.55; color:#4B5563\">Benutzer werden über das zentrale eIAM der Bundesverwaltung verwaltet. Die App hat kein eigenes Benutzerverzeichnis, keine Registrierung und kein Passwort — Anmeldung über OIDC, Rollen als Claims im Token.<\u002Fp>\n        <div style=\"font-size:13px; line-height:1.55; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Drei Rollen genügen: read für alle, plan für die Abteilungsleitung im eigenen Bereich, admin für das Portfoliomanagement. Die Abteilungszugehörigkeit kommt aus dem Token, damit niemand über einen Parameter in eine fremde Abteilung schaut.<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.55; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Was die App trotzdem selbst führen muss: Anstellungsgrad und Abwesenheiten pro Person, sofern HR keine Schnittstelle liefert. Das ist Fachdaten-Pflege, keine Benutzerverwaltung — und der Grund, warum es <span style=\"font-family:'SFMono-Regular', Consolas, monospace; font-size:12px\">/capacity/absences<\u002Fspan> gibt.<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.55; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Abmeldung und Sitzungsdauer folgen eIAM. Verlässt jemand die Abteilung, verschwindet der Zugang mit dem Rollenentzug, die Protokolleinträge bleiben.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; align-items:baseline; gap:8px; flex-wrap:wrap\">\n          <h3 style=\"margin:0; font-size:16px; font-weight:600; color:#111827\">Benutzer und Rollen<\u002Fh3>\n          <span style=\"font-size:11px; font-weight:600; color:#374151; background:#F3F4F6; border-radius:9999px; padding:2px 8px\">nein<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.55; color:#4B5563\">Keine eigene Benutzerverwaltung. Anmeldung über das bestehende SSO, Identität und Organisationszuordnung kommen aus ePPM beziehungsweise dem Verzeichnisdienst. Drei Berechtigungsstufen genügen: <strong>Lesen<\u002Fstrong> für alle, <strong>Planen<\u002Fstrong> für die Abteilungsleitung im eigenen Bereich, <strong>Administration<\u002Fstrong> für das Portfoliomanagement. Keine Masken zum Anlegen von Benutzern.<\u002Fp><div style=\"font-size:13px; line-height:1.5; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Ausnahme: Anstellungsgrad und Abwesenheiten. Liefert HR sie nicht als Schnittstelle, braucht die App genau dafür eine kleine Pflegeansicht — sonst ist die Kapazität ein Nominalwert.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; align-items:baseline; gap:8px; flex-wrap:wrap\">\n          <h3 style=\"margin:0; font-size:16px; font-weight:600; color:#111827\">User Onboarding<\u002Fh3>\n          <span style=\"font-size:11px; font-weight:600; color:#374151; background:#F3F4F6; border-radius:9999px; padding:2px 8px\">nein<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.55; color:#4B5563\">Kein Onboarding-Flow. Mit SSO und abgeleiteten Rollen ist der erste Aufruf identisch mit dem hundertsten: die Landing Page zeigt, was ansteht. Was es stattdessen braucht, ist billiger und wirksamer: ein Leerzustand pro Ansicht, der sagt, warum nichts da ist, und ein kurzer Text «was diese App tut und was nicht» — die Abgrenzung zu ePPM ist die einzige Frage, die neue Nutzende wirklich haben.<\u002Fp><div style=\"font-size:13px; line-height:1.5; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Der Bearbeiten-Schalter ist die Onboarding-Hilfe: er macht sichtbar, dass die App standardmässig eine Lesesicht ist.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; align-items:baseline; gap:8px; flex-wrap:wrap\">\n          <h3 style=\"margin:0; font-size:16px; font-weight:600; color:#111827\">Benachrichtigungen<\u002Fh3>\n          <span style=\"font-size:11px; font-weight:600; color:#374151; background:#F3F4F6; border-radius:9999px; padding:2px 8px\">ja, reduziert<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.55; color:#4B5563\">Ja, aber wenige und asynchron. Drei Ereignisse verdienen eine Meldung: ein <strong>Meilenstein wird überfällig oder verschoben<\u002Fstrong> und löst Ressourcenwirkung aus; eine <strong>Änderung einer anderen Person erzeugt neue Überlast<\u002Fstrong> bei mir; <strong>offener Bedarf<\u002Fstrong> rückt in ein Quartal ohne Zuweisung.<\u002Fp><div style=\"font-size:13px; line-height:1.5; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Kanal: wöchentlicher E-Mail-Digest vor der Teamsitzung, dazu ein Zähler in der App. Kein Push, kein Echtzeit-Kanal.<\u002Fdiv><div style=\"font-size:13px; line-height:1.5; color:#4B5563; border-left:2px solid #E5E7EB; padding-left:10px\">Regel: eine Benachrichtigung ist nie der einzige Träger einer Information — dieselben Punkte stehen auf der Landing Page.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; align-items:baseline; gap:8px; flex-wrap:wrap\">\n          <h3 style=\"margin:0; font-size:16px; font-weight:600; color:#111827\">Schreibrichtung<\u002Fh3>\n          <span style=\"font-size:11px; font-weight:600; color:#374151; background:#F3F4F6; border-radius:9999px; padding:2px 8px\">zu entscheiden<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.55; color:#4B5563\">Die härteste offene Frage. Wenn ePPM den Golden Record führt, darf die App Meilensteine nicht still verschieben, sonst divergieren die Systeme. Empfehlung: Termine lesend spiegeln, und eine Verschiebung als <strong>Antrag<\u002Fstrong> aus der App heraus stellen, statt sie zu schreiben. Die App plant den Bedarf gegen die Termine, sie besitzt sie nicht.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; align-items:baseline; gap:8px; flex-wrap:wrap\">\n          <h3 style=\"margin:0; font-size:16px; font-weight:600; color:#111827\">Datenaktualität<\u002Fh3>\n          <span style=\"font-size:11px; font-weight:600; color:#374151; background:#F3F4F6; border-radius:9999px; padding:2px 8px\">täglich<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.55; color:#4B5563\">Nächtlicher Abgleich genügt für Stammdaten, Phasen und Kredite. Jede Ansicht nennt ihren Stand, und bei abweichendem Stand pro Quelle wird er getrennt ausgewiesen. Pensen und Begründungen sind app-eigen und damit sofort aktuell — die Mischung aus «gestern» und «jetzt» muss sichtbar bleiben.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; align-items:baseline; gap:8px; flex-wrap:wrap\">\n          <h3 style=\"margin:0; font-size:16px; font-weight:600; color:#111827\">Nachvollziehbarkeit<\u002Fh3>\n          <span style=\"font-size:11px; font-weight:600; color:#374151; background:#F3F4F6; border-radius:9999px; padding:2px 8px\">Pflicht<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.55; color:#4B5563\">App-eigene Daten brauchen ein unveränderliches Protokoll: wer hat wann welches Pensum geändert, mit welcher Begründung, und wer hat eine Überlast freigegeben. Die Tabelle «Letzte Änderungen» auf der Landing Page ist die Oberfläche dieses Protokolls, nicht ein Aktivitätsstrom.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:32px; max-width:1460px\">\n    <div>\n      <div style=\"font-size:12px; color:#6B7280; font-weight:600\">Ressourcenplanung · Konzeptskizzen<\u002Fdiv>\n      <h1 style=\"margin:8px 0 0; font-size:30px; line-height:1.2; font-weight:700; color:#111827; letter-spacing:-0.02em\">Vier Tabs, ein Datenstand<\u002Fh1>\n      <p style=\"margin:10px 0 0; max-width:900px; font-size:15px; line-height:1.55; color:#4B5563; text-wrap:pretty\">Eine Spalte pro Tab — Ansichten desselben Tabs stapeln sich untereinander, neue Tabs kommen rechts dazu. Alles über den Tabs ist in jeder Ansicht identisch; nur der Inhalt darunter wechselt. Alle Zahlen stammen aus einer Zuteilungstabelle: 11 Projekte, 6 Personen, 480 % Kapazität netto, 572 % Bedarf in Q3/2026. Verweise im Chat: Landing <a href=\"#1i\">1i<\u002Fa> · Übersicht <a href=\"#1a\">1a<\u002Fa> <a href=\"#1a2\">1a-2<\u002Fa> <a href=\"#1a4\">1a-4<\u002Fa> <a href=\"#1a3b\">1a-3b<\u002Fa> · Termine <a href=\"#1e\">1e<\u002Fa> <a href=\"#1d3\">1d-3<\u002Fa> <a href=\"#1d4\">1d-4<\u002Fa> · Dashboard <a href=\"#1g\">1g<\u002Fa> · Verlauf <a href=\"#1j\">1j<\u002Fa>.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:0 0 auto; border:1px solid #D1D5DB; border-radius:8px; background:#fff; padding:14px 16px; font-size:13px; line-height:1.5; color:#4B5563; max-width:300px\">\n      <strong style=\"color:#111827\">Interaktiv in 1a:<\u002Fstrong> Sprachmenü (DE/EN live, FR/IT gelistet), Bearbeiten einschalten und auf eine Pensum-Zelle klicken, Nur Überlast, Attribute mit Soll und Verlauf. Das Sprachmenü übersetzt alle Ansichten.<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;de&quot;,&quot;en&quot;],&quot;default&quot;:&quot;de&quot;,&quot;tsType&quot;:&quot;'de' | 'en'&quot;,&quot;section&quot;:&quot;Verhalten&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;kompakt&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;'normal' | 'kompakt'&quot;,&quot;section&quot;:&quot;Verhalten&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.Q = ['Q3/2026','Q4/2026','Q1/2027','Q2/2027','Q3/2027','Q4/2027','Q1/2028','Q2/2028'];\n    this.cap = [540,540,560,560,560,560,560,560];\n    this.extern = [35,35,70,65,60,35,10,5];\n    this.absence = [60,30,25,30,60,30,25,30];\n    this.preCredit = ['pr51','pr06','pr57','pr03','pr26','pr39','pr53'];\n    const PH = {\n      p11: ['11 Strat. Planung', '#F3F4F6', '#374151'],\n      p21: ['21 Machbarkeit', '#DBEAFE', '#1E40AF'],\n      p22: ['22 Auswahlverfahren', '#DBEAFE', '#1E40AF'],\n      p31: ['31 Vorprojekt', '#DCFCE7', '#166534'],\n      p32: ['32 Bauprojekt', '#DCFCE7', '#166534'],\n      p33: ['33 Bewilligungsverf.', '#DCFCE7', '#166534'],\n      p41: ['41 Ausschreibung', '#FEF3C7', '#78350F'],\n      p51: ['51 Ausführungsproj.', '#EDE9FE', '#5B21B6'],\n      p52: ['52 Ausführung', '#EDE9FE', '#5B21B6'],\n      p62: ['62 Überwachung', '#CFFAFE', '#155E75']\n    };\n    this.sollMap = { pr51:80, pr12:100, pr06:40, pr57:60, pr66:75, pr44:90, pr03:20, pr10:30, pr26:25, pr39:40, pr53:40 };\n    this.dot = { '#F3F4F6':'#9CA3AF', '#DBEAFE':'#3B82F6', '#DCFCE7':'#16A34A', '#FEF3C7':'#D97706', '#EDE9FE':'#7C3AED', '#CFFAFE':'#0891B2' };\n    this.projects = [\n      { key:'pr51', id:'…0051', title:'Musterl piel': [104,98,105,85,70,50,25,15],\n      'Tobias Muster': [92,105,112,105,95,80,60,45],\n      'Paula Beispiel': [90,95,94,94,85,75,60,44],\n      'Nadia Muster': [60,75,87,92,95,92,62,42]\n    };\n    this.anst = { 'Sonja Beispiel':100, 'Lars Muster':100, 'Alina Beispiel':100, 'Tobias Muster':100, 'Paula Beispiel':80, 'Nadia Muster':60 };\n    this.dict = {\n      'Ressourcenplanung':'Resource planning',\n      'Portfolio':'Portfolio', 'Ressourcen':'Resources', 'Meilensteine':'Milestones',\n      'Übersicht':'Overview', 'Projekte':'Projects', 'Termine':'Schedule', 'Dashboard':'Dashboard',\n      'Exportieren':'Export', 'Szenario':'Scenario', 'Bedarf erfassen':'Add demand',\n      'Projekt, ID oder Person suchen':'Search project, ID, person', 'Suche':'Search',\n      'Anmelden':'Sign in', 'Abmelden':'Sign out', 'Sprache':'Language',\n      'SIA-Phase':'SIA phase', 'Projektleitung':'Project lead', 'Teilportfolio':'Location',\n      'Priorität':'Priority', 'Aktive Filter:':'Active filters:',\n      '3 Projektierung':'3 Design', 'Priorität hoch':'Priority high',\n      '✕ Alle Filter zurücksetzen':'✕ Reset all filters',\n      'Nur Überlast':'Overload only', 'Freie Kapazität finden':'Find free capacity',\n      'Plan':'Plan', 'Ist':'Actual', 'Abweichung':'Variance',\n      'Zeitraster':'Time scale', 'Jahr':'Year', 'Quartal':'Quarter', 'Monat':'Month', 'Heute':'Today',\n      'Kapazität Q3/2026':'Capacity Q3/2026',\n      '6 Personen, 2 Teilzeit':'6 people, 2 part-time',\n      'Bedarf Q3/2026':'Project demand Q3/2026',\n      'über 11 Projekte':'across 11 projects',\n      'Personen über 100 %':'People above 100 %',\n      'Nicht zugewiesener Bedarf':'Unassigned demand',\n      'Freie Kapazität ab Q4/2027':'Free capacity from Q4/2027',\n      'Projekt':'Project', 'Bezeichnung':'Description', 'Kredit':'Budget m',\n      'Pensum':'Pensum', 'Bedarf total':'Total demand',\n      'davon extern beauftragt':'of which not booked on people',\n      'Auslastung':'Utilisation', 'Überlast':'Overload', 'knapp':'tight', 'ok':'ok', 'frei':'free',\n      'Bearbeiten':'Edit', 'Pensum bearbeiten':'Edit pensum', 'Übernehmen':'Apply', 'Abbrechen':'Cancel', 'Prüfen':'Review',\n      'Begründung':'Reason', '— Pflicht bei Überlast':'— required for overload',\n      'Bauleitung Etappe 2 vorgezogen, Freigabe Abteilungsleitung liegt vor.':'Site management stage 2 brought forward, division head approval on file.',\n      'SIA 112 Phasen':'SIA 112 phases',\n      '1 Strategische Planung · 11':'1 Strategic planning · 11',\n      '2 Vorstudien · 21, 22':'2 Preliminary studies · 21, 22',\n      '3 Projektierung · 31–33':'3 Design · 31–33',\n      '4 Ausschreibung · 41':'4 Tendering · 41',\n      '5 Realisierung · 51–53':'5 Realisation · 51–53',\n      '6 Bewirtschaftung · 61–63':'6 Operation · 61–63',\n      'Prototyp, fiktive Inhalte — nur zur Demonstration':'Prototype, fictional content — for demonstration only'\n    };\n    this.state = {\n      lang: props.lang || 'de',\n      langOpen: false,\n      searchOpen: false,\n      menu: null,\n      cardMenu: null,\n      exportMenu: false,\n      langMenu: false,\n      footDetails: false,\n      attrOpen: false,\n      unit: 'pct',\n      soll: false,\n      ampel: true,\n      verlauf: false,\n      edit: false,\n      editing: null,\n      draft: 95,\n      overrides: {},\n      overloadOnly: false\n    };\n  }\n\n  componentDidMount() { this.applyLang(); }\n  componentDidUpdate() { this.applyLang(); }\n\n  applyLang() {\n    if (this._appliedLang === this.state.lang) return;\n    this._appliedLang = this.state.lang;\n    const en = this.state.lang === 'en';\n    if (!document.body) return;\n    const it = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);\n    const nodes = [];\n    while (it.nextNode()) nodes.push(it.currentNode);\n    nodes.forEach(n => {\n      const raw = n.nodeValue;\n      if (!raw || !raw.trim()) return;\n      if (n.__de === undefined) n.__de = raw;\n      const de = n.__de;\n      if (en) {\n        const hit = this.dict[de.trim()];\n        if (hit && n.nodeValue !== hit) n.nodeValue = raw.replace(de.trim(), hit);\n      } else if (n.nodeValue !== de) {\n        n.nodeValue = de;\n      }\n    });\n  }\n\n  num(v) { return this.state.unit === 'fte' ? (v / 100).toFixed(2).replace('.', ',') : String(v); }\n  suffix() { return this.state.unit === 'fte' ? ' FTE' : ' %'; }\n\n  val(key, q, base) {\n    const o = this.state.overrides[key + ':' + q];\n    return o === undefined ? base : o;\n  }\n\n  disp(v) {\n    return { n: v, label: v ? this.num(v) : '–' };\n  }\n\n  heat(n) {\n    if (n === null) return ['#FAFBFD', '#9CA3AF'];\n    if (n < 0) return ['#FEE2E2', '#991B1B'];\n    if (n === 0) return ['#FFFFFF', '#9CA3AF'];\n    if (n < 40) return ['#F4F7FC', '#1F2937'];\n    if (n < 80) return ['#E7EEF8', '#1F2937'];\n    if (n < 120) return ['#D6E3F3', '#111827'];\n    return ['#C2D5EC', '#111827'];\n  }\n\n  bl(q) { return (q === 0 || q === 2 || q === 6) ? '1px solid #E5E7EB' : '1px solid #F3F4F6'; }\n\n  projCells(p) {\n    return p.cells.map((v, q) => this.val(p.key, q, v));\n  }\n\n  renderVals() {\n    const st = this.state;\n    const h = (this.props.density === 'kompakt' ? 32 : 38);\n    const hPx = h + 'px';\n    const editKey = st.editing ? this.projects[st.editing.r].key : null;\n\n    const cellFor = (rowKey, q, v, who, warn, ed, onClick) => {\n      const d = this.disp(v, q);\n      const hc = this.heat(d.n);\n      return {\n        label: warn && d.n !== null ? '▲ ' + d.label : d.label,\n        warnFg: warn ? '#B91C1C' : null,\n        aria: who + ', ' + this.Q[q] + ': ' + (d.n === null ? 'kein Ist-Wert' : d.label + ' %') + (warn ? ' — Person über 100 % belegt, Überlast' : ''),\n        h: hPx, bl: this.bl(q), bg: hc[0], fg: hc[1],\n        weight: warn ? '700' : '500',\n        ring: ed ? 'inset 0 0 0 2px #2563EB' : 'none',\n        cursor: this.state.edit ? 'pointer' : 'default',\n        onClick: onClick || this.noop\n      };\n    };\n\n    const cellCache = {};\n    const cellsOf = (p) => (cellCache[p.key] || (cellCache[p.key] = this.projCells(p)));\n    let projs = this.projects;\n    if (st.overloadOnly) projs = this.projects.filter(p => { const L = this.loads[p.ppe], A = this.anst[p.ppe]; return !!(L && L.some((v, q) => v / A * 100 > 100)); });\n\n    const rows = [];\n    projs.forEach((p, pi) => {\n      const cells = cellsOf(p);\n      const isOpen = false;\n      rows.push({\n        h: hPx, bg: p.group ? '#FAFBFD' : (p.open ? '#FFFBEB' : '#FFFFFF'), z: '1',\n        idText: p.id, title: p.title, indent: '0px',\n        titleFg: '#111827', titleWeight: '600',\n        phaseLabel: p.ph[0], phaseDot: this.dot[p.ph[1]] || '#9CA3AF',\n        ampelBg: (function () { const L = this.loads[p.ppe], A2 = this.anst[p.ppe]; if (!L) return '#F3F4F6'; const pc = L[0] / A2 * 100; return pc > 100 ? '#FCA5A5' : pc >= 95 ? '#FDE68A' : '#BBF7D0'; }).call(this),\n        ampelBd: (function () { const L = this.loads[p.ppe], A2 = this.anst[p.ppe]; if (!L) return '#9CA3AF'; const pc = L[0] / A2 * 100; return pc > 100 ? '#DC2626' : pc >= 95 ? '#D97706' : '#16A34A'; }).call(this),\n        ampelRadius: (function () { const L = this.loads[p.ppe], A2 = this.anst[p.ppe]; if (!L) return '9999px'; return (L[0] / A2 * 100) > 100 ? '1px' : '9999px'; }).call(this),\n        ampelRot: (function () { const L = this.loads[p.ppe], A2 = this.anst[p.ppe]; if (!L) return 'none'; return (L[0] / A2 * 100) > 100 ? 'rotate(45deg)' : 'none'; }).call(this),\n        ampelTitle: (function () { const L = this.loads[p.ppe], A2 = this.anst[p.ppe]; if (!L) return 'Keine Projektleitung zugewiesen — keine Ampel'; const pc = Math.round(L[0] / A2 * 100); return p.ppe + ': ' + pc + ' % der Anstellung in Q3/2026 — ' + (pc > 100 ? 'Überlast' : pc >= 95 ? 'knapp' : 'im Rahmen'); }).call(this),\n        sollLabel: st.soll ? this.num(this.sollMap[p.key] || 0) + this.suffix() : '',\n        spark: st.verlauf ? cells.map(v => ({ h: v ? Math.max(8, Math.round(v / 120 * 100)) + '%' : '2px', bg: v ? '#9CB8DE' : '#E5E7EB' })) : [],\n        sollFg: st.soll && cells[0] > (this.sollMap[p.key] || 0) ? '#B91C1C' : '#4B5563',\n        sollWeight: st.soll && cells[0] > (this.sollMap[p.key] || 0) ? '600' : '400',\n        ppe: p.ppe, kredit: p.kredit,\n        cells: cells.map((v, q) => {\n          const L = this.loads[p.ppe];\n          const warn = !!(L && L[q] > 100);\n          const ed = !!(editKey === p.key && st.editing.q === q);\n          return cellFor(p.key, q, v, p.title + ' · ' + p.ppe, warn, ed, () => this.pick(q, v, pi));\n        })\n      });\n      if (isOpen) {\n        this.people.forEach((pe, i) => {\n          rows.push({\n            h: hPx, bg: '#FFFFFF', z: (editKey === pe.key ? '20' : '1'),\n            caret: '', expanded: undefined, toggleLabel: '', onToggle: this.noop,\n            idText: '', title: pe.name, indent: '18px',\n            titleFg: '#374151', titleWeight: '400',\n            phaseLabel: pe.role, phaseBg: '#F9FAFB', phaseFg: '#4B5563',\n            ppe: '', kredit: '',\n            totalLabel: pe.cells.map((v, q) => this.val(pe.key, q, v)).reduce((a, b) => a + b, 0) + ' %',\n            cells: pe.cells.map((v0, q) => {\n              const v = this.val(pe.key, q, v0);\n              const warn = !!(pe.load && pe.load[q] > pe.anst);\n              const ed = !!(editKey === pe.key && st.editing.q === q);\n              return cellFor(pe.key, q, v, pe.name, warn, ed, () => this.pick(q, v, i));\n            })\n          });\n        });\n        rows.push({\n          h: hPx, bg: '#FFFFFF', z: '1', caret: '', expanded: undefined, toggleLabel: '', onToggle: this.noop,\n          idText: '', title: '＋ Person zuweisen', indent: '18px',\n          titleFg: '#1D4ED8', titleWeight: '600',\n          phaseLabel: '', phaseBg: 'transparent', phaseFg: '#4B5563', ppe: '', kredit: '', totalLabel: '',\n          cells: this.Q.map((_, q) => ({ label: '', aria: 'Pensum e
