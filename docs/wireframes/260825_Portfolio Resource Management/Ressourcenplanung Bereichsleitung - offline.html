 nl !== null && nl > 100;\n      pop = {\n        open: true,\n        left: Math.max(8, (st.verlauf ? 676 : 806) + q * 72 + 72 - 308) + 'px',\n        top: (64 + (st.editing.r + 1) * h) + 'px',\n        who: pe.title,\n        what: pe.ppe + ' · ' + this.Q[q],\n        value: this.num(st.draft) + this.suffix(),\n        warn: nl === null\n          ? 'Keine Projektleitung zugewiesen — das Pensum kann noch auf keine Person gebucht werden.'\n          : (over ? pe.ppe + ' wäre damit bei ' + nl + ' % — ' + (nl - 100) + ' % über der Anstellung.'\n                  : pe.ppe + ' wäre damit bei ' + nl + ' % — innerhalb der Anstellung.'),\n        warnBg: over ? '#FEF2F2' : '#F0FDF4',\n        warnBorder: over ? '#FECACA' : '#BBF7D0',\n        warnFg: over ? '#991B1B' : '#166534',\n        inc: this.inc, dec: this.dec, apply: this.apply, cancel: this.cancel\n      };\n    }\n\n    const M = {};\n    ['sort','group','phase','resp','part'].forEach(id => {\n      const open = st.menu === id;\n      M['m_' + id + '_open'] = open;\n      M['m_' + id + '_aria'] = open ? 'true' : 'false';\n      M['m_' + id + '_border'] = open ? '#111827' : '#D1D5DB';\n      M['m_' + id + '_toggle'] = () => this.setState(s2 => ({ menu: s2.menu === id ? null : id }));\n    });\n    const on = '#2563EB', onFg = '#FFFFFF', off = '#FFFFFF', offFg = '#374151';\n    const L = { de:'Deutsch', fr:'Français', it:'Italiano', en:'English' };\n    const vals = {\n      rows, sumRow, extRow: unbookedRow, progRow, capRow, loadRow, pop,\n      gridCols: (function () {\n        const A = st.ampel ? 36 : 0, V = st.verlauf ? 130 : 0, S = st.soll ? 76 : 0;\n        const kre = (st.soll && st.verlauf) ? 76 : 112, pl = (st.soll && st.verlauf) ? 110 : 132;\n        const bez = 1382 - 576 - V - A - 100 - 128 - pl - kre - S;\n        return A + 'px 100px ' + bez + 'px 128px ' + pl + 'px ' + kre + 'px ' + S + 'px repeat(8, 72px) ' + V + 'px';\n      })(),\n      ampelCell: st.ampel ? 'flex' : 'none',\n      ampelAria: st.ampel ? 'true' : 'false',\n      ampelSwBg: st.ampel ? '#111827' : '#D1D5DB',\n      ampelKnob: st.ampel ? '17px' : '2px',\n      toggleAmpel: () => this.setState(s2 => ({ ampel: !s2.ampel })),\n      verlaufHead: st.verlauf ? 'Verlauf' : '',\n      verlaufCell: st.verlauf ? 'flex' : 'none',\n      verlaufBorder: st.verlauf ? '1px solid #E5E7EB' : '0',\n      verlaufAria: st.verlauf ? 'true' : 'false',\n      verlaufSwBg: st.verlauf ? '#111827' : '#D1D5DB',\n      verlaufKnob: st.verlauf ? '17px' : '2px',\n      toggleVerlauf: () => this.setState(s2 => ({ verlauf: !s2.verlauf })),\n      sollHead: st.soll ? 'Soll Q3' : '',\n      sollAria: st.soll ? 'true' : 'false',\n      sollSwBg: st.soll ? '#111827' : '#D1D5DB',\n      sollKnob: st.soll ? '17px' : '2px',\n      toggleSoll: () => this.setState(s2 => ({ soll: !s2.soll })),\n      langCode: st.lang.toUpperCase(),\n      langName: L[st.lang],\n      langOpen: st.langOpen,\n      langMenuLabel: st.langOpen ? 'true' : 'false',\n      toggleLang: () => this.setState(s => ({ langOpen: !s.langOpen })),\n      pickDe: () => this.setState({ lang: 'de', langOpen: false }),\n      pickEn: () => this.setState({ lang: 'en', langOpen: false }),\n      deMark: st.lang === 'de' ? '✓' : '', enMark: st.lang === 'en' ? '✓' : '',\n      deBg: st.lang === 'de' ? '#EFF6FF' : '#FFFFFF',\n      enBg: st.lang === 'en' ? '#EFF6FF' : '#FFFFFF',\n      attrOpen: st.attrOpen,\n      attrAria: st.attrOpen ? 'true' : 'false',\n      attrBorder: st.attrOpen ? '#111827' : '#D1D5DB',\n      toggleAttr: () => this.setState(s2 => ({ attrOpen: !s2.attrOpen })),\n      isPct: st.unit === 'pct' ? 'true' : 'false',\n      isFte: st.unit === 'fte' ? 'true' : 'false',\n      pctBg: st.unit === 'pct' ? '#111827' : '#fff', pctFg: st.unit === 'pct' ? '#fff' : '#374151',\n      fteBg: st.unit === 'fte' ? '#111827' : '#fff', fteFg: st.unit === 'fte' ? '#fff' : '#374151',\n      setPct: () => this.setState({ unit: 'pct' }),\n      setFte: () => this.setState({ unit: 'fte' }),\n      editAria: st.edit ? 'true' : 'false',\n      editBg: st.edit ? '#111827' : '#fff',\n      editFg: st.edit ? '#fff' : '#374151',\n      editBorder: st.edit ? '#111827' : '#D1D5DB',\n      editSwBg: st.edit ? '#4ADE80' : '#D1D5DB',\n      editKnob: st.edit ? '17px' : '2px',\n      toggleEdit: () => this.setState(s2 => ({ edit: !s2.edit, editing: null })),\n      cardKeys: null,\n      searchAria: st.searchOpen ? 'true' : 'false',\n      searchW: st.searchOpen ? '250px' : '40px',\n      searchLabel: st.searchOpen ? 'Projekt, ID oder Person' : '',\n      searchBorder: st.searchOpen ? '#2563EB' : '#D1D5DB',\n      toggleSearch: () => this.setState(s2 => ({ searchOpen: !s2.searchOpen })),\n      overloadOn: st.overloadOnly ? 'true' : 'false',\n      olBg: st.overloadOnly ? '#FEE2E2' : '#FFFFFF',\n      olFg: st.overloadOnly ? '#991B1B' : '#374151',\n      olBorder: st.overloadOnly ? '#FCA5A5' : '#D1D5DB',\n      toggleOverload: () => this.setState(s => ({ overloadOnly: !s.overloadOnly }))\n    };\n    for (let c = 1; c <= 8; c++) {\n      const open = st.cardMenu === c;\n      vals['cardMenu' + c + 'Open'] = open;\n      vals['cardMenu' + c + 'Aria'] = open ? 'true' : 'false';\n      vals['cardMenu' + c + 'Bg'] = open ? '#F3F4F6' : 'transparent';\n      vals['cardMenu' + c + 'Border'] = open ? '#D1D5DB' : 'transparent';\n      vals['cardMenu' + c + 'Toggle'] = () => this.setState(s2 => ({ cardMenu: s2.cardMenu === c ? null : c }));\n    }\n    vals.footDetails = st.footDetails;\n    vals.footDetailsLabel = st.footDetails ? 'Details ausblenden' : 'Details anzeigen';\n    vals.toggleFootDetails = () => this.setState(s2 => ({ footDetails: !s2.footDetails }));\n    vals.langMenuOpen = st.langMenu;\n    vals.langAria = st.langMenu ? 'true' : 'false';\n    vals.langToggle = () => this.setState(s2 => ({ langMenu: !s2.langMenu }));\n    vals.langLabel = (st.lang || 'de').toUpperCase();\n    ['de','fr','it','en'].forEach(l => {\n      const K = l[0].toUpper
